<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Example</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            background-color: crimson;
            color: white;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Inline Event Handling</h1>
    <button onclick="console.log('button was clicked');alert('hello')">Click Me!</button>
     <button ondblclick="console.log('button was clicked 2 Times');">Click Me!</button>
     <br><br>
     <div onmouseover="console.log('You Are Inside Div')">This is a Box</div>
</body>
</html>
